# =============================================================================
# Nagar Shield — CI
#
# The pull-request gate. Every job here fails the PR on a problem; none of
# them is allowed to fail silently.
#
# The job graph:
#
#   lint ─┐
#   typecheck ─┼─> shared-test ─> unit-test-mobile ─┐
#               │                 unit-test-admin  ─┼─> migration-dry-run ─> rls-integration ─> secret-scan ─> build (reserved)
#               │                 unit-test-functions ─┘
#   maestro-flow ────────────────────────────────────┘ (independent — validates the nightly flow)
#
# `shared-test` gates every other test job: the shared contracts are the
# source of truth, so a broken contract fails the PR before any consumer
# runs. `migration-dry-run` precedes `rls-integration` because the RLS tests
# need a schema with the migrations applied. `secret-scan` runs last because
# it inspects the **built** bundles. `maestro-flow` is independent: it
# validates the nightly emulator flow, so a typo there fails the PR instead
# of the nightly build.
#
# `build` is a **reserved slot**, not a build: `if: false` skips it, and
# unit 008 fills it in. It sits behind `secret-scan` so the graph shows
# where the release will attach.
#
# Fork PRs get no secrets and no write permissions. The migration, RLS, and
# secret jobs run entirely against a local Supabase stack and a pattern list,
# so they work on a fork with no credential at all.
# =============================================================================

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The pipeline needs to read the repository and nothing else. There is no
# deploy job here — the production release is a human-driven runbook step.
# The `build` job at the end is a reserved slot, not a deploy, and it is
# skipped.
permissions:
  contents: read

# A superseded run on the same branch is cancelled rather than left to
# compete for the free-tier runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pinned toolchain. The installing job and every testing job use the
  # same Node and pnpm, so a job can never test against a different
  # toolchain than the one that installed the dependencies.
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '9.15.0'
  SUPABASE_CLI_VERSION: '2.122.0'

jobs:
  # ---------------------------------------------------------------------------
  # The two cheapest signals. They gate everything else.
  # ---------------------------------------------------------------------------

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # The formatting contract. ESLint owns the *semantic* rules and
      # Prettier owns the *formatting*, and the two must not disagree — so
      # the formatting check is a separate signal, not folded into ESLint.
      #
      # `.prettierignore` says which files Prettier does **not** own: the
      # generated artefacts and the vendored Edge Functions mirror are owned
      # by their generators, and the specification trees are prose.
      - name: the formatting contract holds
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The three workspaces (mobile, admin, shared).
      - run: pnpm typecheck

      # The Edge Functions, under the Deno type checker. A type error in a
      # function fails the PR here, before any test job runs.
      - name: typecheck the Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - run: pnpm fn:typecheck

      # The story index must agree with the story files on disk. The Status
      # column and the header count are **derived** — a story file's
      # `implemented` frontmatter is the authority.
      #
      # This gate exists because a hand-maintained index drifts, and a drifted
      # index is how a project ends up believing a story is done when it is
      # not. The tool needs no database and no build, so it runs here.
      - name: the story index matches the story files
        run: pnpm story:index:check

  # ---------------------------------------------------------------------------
  # The shared contracts — the first test signal, and the gate for every
  # other test job.
  # ---------------------------------------------------------------------------

  shared-test:
    name: shared-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nagar-shield/shared test -- --ci

  # ---------------------------------------------------------------------------
  # The consumer test jobs. Each declares `needs: [shared-test]`, so a broken
  # contract skips them instead of running them against a broken baseline.
  # ---------------------------------------------------------------------------

  unit-test-mobile:
    name: unit-test-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [shared-test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nagar-shield/mobile test -- --ci

  unit-test-admin:
    name: unit-test-admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [shared-test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @nagar-shield/admin test -- --ci

  unit-test-functions:
    name: unit-test-functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [shared-test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The pure job helpers — the age cut-offs, the idempotency rules, and
      # the tombstone builder — live in the shared package and are covered by
      # the shared suite. The functions job adds the **type** check over the
      # Deno sources, which is the only thing the Edge Functions have that
      # the other workspaces do not.
      - name: typecheck the Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - run: pnpm fn:typecheck

  # ---------------------------------------------------------------------------
  # The migration dry-run. Local only — it never touches staging or
  # production. Migrations are forward-only, so this is the only place a bad
  # migration is caught before it is deployed.
  # ---------------------------------------------------------------------------

  migration-dry-run:
    name: migration-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-test-mobile, unit-test-admin, unit-test-functions]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # `supabase db reset` drops the local database and replays **every**
      # migration in filename order against a fresh one. A migration with a
      # syntax error fails here, with nothing deployed anywhere.
      - name: replay every migration against a local stack
        run: npx supabase start && npx supabase db reset --local

      # The drift guard: the reference data in Postgres must match the JSON
      # the mobile bundle ships, byte for byte.
      - name: the seeded reference data has not drifted
        run: pnpm data:check

      # The shared mirror: the Edge Functions' vendored contracts must match
      # `packages/shared`, so a stale contract can never reach production.
      - name: the Edge Functions mirror has not drifted
        run: pnpm shared:check

      # The SQL suites — the schema contract, the business rules, the read
      # models, the write guards, the password-reset contract, the contacts
      # contract, and the report-category contract — against the freshly
      # migrated database.
      - name: run the SQL test suites
        run: pnpm db:test

      - name: the container logs on failure
        if: failure()
        run: npx supabase status || docker logs supabase_db_nagar-shield || true

  # ---------------------------------------------------------------------------
  # The Maestro flow check.
  #
  # The nightly build runs `maestro/panic-path.yaml` against an emulator. A
  # typo in that file only fails the nightly job — after a full APK build,
  # which is slow and burns the free-tier build quota. This job validates
  # the flow up front: the YAML parses, the commands are real Maestro
  # commands, the `appId` matches the EAS package, and every selector
  # refers to a `testID` or a string the app actually renders.
  #
  # It needs no database and no emulator, so it runs early and cheap.
  # ---------------------------------------------------------------------------

  maestro-flow:
    name: maestro-flow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: the Maestro flows are valid
        run: pnpm maestro:check

  # ---------------------------------------------------------------------------
  # The RLS integration tests. They exercise the policies as an **anon**
  # client and as an **authenticated** client, including the negative tests:
  # an anon client cannot read a private row, a citizen cannot moderate, and
  # no client can read or write `job_runs`.
  # ---------------------------------------------------------------------------

  rls-integration:
    name: rls-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [migration-dry-run]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: start the local stack
        run: npx supabase start

      # The edge runtime reads `supabase/functions/.env`, which is committed
      # and carries no credential. It points the mail transport at the local
      # stack's own mail server, so the password-reset probe below can read a
      # real code out of the mailbox. If this file is missing the function
      # reports `password_reset_mail_unconfigured` and the probe fails on
      # "the code was delivered to the mailbox" — which is the intended
      # behaviour: a missing transport must fail loudly, not silently.
      - name: the mail transport is configured
        run: |
          test -f supabase/functions/.env
          grep -q '^MAIL_HTTP_ENDPOINT=' supabase/functions/.env

      # The REST smoke tests exercise the read models and the RPCs as the
      # anon, citizen, and moderator roles against the local stack.
      - name: the REST read models and RPCs
        run: pnpm db:smoke

      # The disabled-account write guard, proved over the real PostgREST path
      # rather than only inside Postgres. The SQL suite proves the guard in
      # the database; this proves the door the Edge Function does not own is
      # actually closed.
      - name: a disabled account cannot write
        run: pnpm guard:check

      # The biometric failure accounting (FR-AUTH-5), proved over the same
      # door. The SQL suite proves the thresholds inside Postgres; this
      # proves the client actually receives the answer the gate screen
      # renders — 3 fails → password, 5 fails → auto-disabled.
      - name: the biometric failure accounting
        run: pnpm biometric:check

      # The alternate phone's format constraint. The SQL suite proves the
      # CHECK inside Postgres; this proves the client's own write path — the
      # normalised value it sends, and the fact that the column is NOT
      # unique, so two accounts may hold the same family number.
      #
      # The non-BD assertion is the one that earns its keep: the obvious form
      # of the CHECK silently accepts every non-BD number, because a CHECK
      # only rejects FALSE and `NULL = '…'` is NULL.
      - name: the alternate phone constraint
        run: pnpm alternate:check

      # The signup contract, proved over the public Auth door — the same
      # door the app uses. The SQL suite cannot prove this half: the signup
      # trigger, the phone normalisation, and the UNIQUE constraint all live
      # in one transaction, and only the transaction can show that a rejected
      # signup leaves **no** `auth.users` row behind.
      #
      # The "gains NO auth.users row" assertions are the ones that earn
      # their keep. A rejected signup that still left a row would be a
      # half-created account — an Auth identity with no profile.
      - name: the signup contract
        run: pnpm signup:check

      # The password-reset contract, proved end to end: the code is generated,
      # mailed, read back out of the mailbox, and redeemed.
      #
      # The SQL suite cannot prove this half. It can show that a wrong code is
      # refused and that the attempt counter survives the rejection, but only
      # the live probe can show that the code reaches the user at all — and
      # that the whole path from the mailbox to a GoTrue session works.
      #
      # It also proves the property that matters most: the **correct** code is
      # refused while the cooldown runs, so the refusal is server-side rather
      # than a client timer.
      - name: the password-reset contract
        run: pnpm reset:check

      # The emergency-contacts CRUD, proved through the door the app uses:
      # GoTrue → PostgREST → the owner-scoped RLS policies.
      #
      # The probe signs in as **two** seeded citizens, because the
      # owner-scoping criteria are only meaningful when there is somebody else
      # to scope against. The assertions that earn their keep are the RLS
      # negative ones — reading another user's contact by id returns an empty
      # set, not the row, and a write against it affects no rows.
      #
      # It also proves the two database guarantees the client cannot: that the
      # owner column defaults to `auth.uid()` (so the client never names an
      # owner, and a forged one is refused), and that a non-BD phone number is
      # refused by the `contacts_phone_format` CHECK.
      - name: the emergency-contacts CRUD contract
        run: pnpm contacts:check

      # The report-detail category contract, proved through the same door:
      # GoTrue → PostgREST → the `update_category` RPC → the RLS policies.
      #
      # The probe signs in as **two** seeded citizens, because the author
      # check is only meaningful when there is somebody else to be checked
      # against.
      #
      # The assertion that earns its keep is the negative one: a non-author's
      # category update is refused with `FORBIDDEN` and the stored category is
      # unchanged. That refusal is the whole point of the story — the old
      # function returned a **success envelope** for a write it had not
      # performed, so the client cached a category the database never stored.
      #
      # The probe also proves the two properties the SQL suite cannot: that
      # the category is the **only** editable field after submit (the
      # description and the visibility are both refused over the wire), and
      # that the report is in the author's own History **immediately**, with
      # no pending-review gate.
      - name: the report-category contract
        run: pnpm category:check

      # The Edge Function smoke tests cover the auth gates on the jobs and the
      # client-facing functions, including the "no client may call the
      # scheduler" posture.
      - name: the Edge Function auth gates
        run: pnpm fn:smoke

      # The capture submit path, proved end to end: the bytes go straight to
      # the private bucket, the metadata goes to `finalize-capture`, and the
      # response's `report_id` is the id of the row that actually exists.
      #
      # This probe exists because of a defect that shipped in the client: it
      # read a camelCase `reportId` from a body that carries `report_id`, so
      # **every** successful capture was misread as a transport failure and
      # handed to the offline queue. Nothing had ever exercised this path end
      # to end, which is why it survived.
      #
      # The assertion that earns its keep is the idempotency one: the same
      # `client_request_id` submitted twice must return the **original**
      # report id, and exactly one report row must exist. A retry that landed
      # twice would file the citizen's evidence twice.
      - name: the capture submit contract
        run: pnpm capture:check

      # The account-deletion contract: the 30-day window, and the writes a
      # soft-deleted account may not make.
      #
      # The SQL suite proves the database side. This proves the **client's**
      # side — that the citizen's own session sees the refusals the recovery
      # screen renders, over the door the app uses.
      #
      # The assertion that earns its keep is the expired window: the
      # deletion is back-dated past 30 days, the way the passage of time
      # would, and the restore must be refused by the **database**. A client
      # timer would be defeated by a device with a wrong clock.
      - name: the account-deletion contract
        run: pnpm deletion:check

      # The moderator console's **read models**, proved through the door the
      # browser uses: GoTrue → PostgREST → the four moderator-only RPCs, with
      # the moderator's **own** session.
      #
      # This is the one part of the console nothing else covered. The Edge
      # Function smoke run proves `moderation-decide` and `disable-user`;
      # `read_models.sql` asserts the four read models from inside Postgres,
      # which cannot see the **JSON shape** the browser actually receives; and
      # the component tests prove the console's own parsing. This probe joins
      # the last two: it calls the RPCs as the browser does and asserts the
      # keys the console renders.
      #
      # The assertions that earn their keep are the **negative** ones. A
      # citizen must be refused the queue, the detail, the account search and
      # the audit trail — that refusal is what makes the console
      # moderator-only. And the account lookup must stay an **exact** match:
      # an empty query, an unmatched query and a partial phone prefix must
      # all return nothing, because the moment it became a fuzzy list it
      # would be a user-database browser rather than a targeted tool
      # (FR-NG-3).
      #
      # The fixture is **built**, not borrowed: the probe files its own
      # report, flags it three times as three distinct citizens so the
      # product's own threshold moves it into the queue, and decides it so
      # the trail has a row. A probe that read whatever happened to be in the
      # database would pass on a dirty instance and fail on a clean one.
      - name: the moderator console contract
        run: pnpm console:check

  # ---------------------------------------------------------------------------
  # The secret scan — the mechanical proof that the service-role key is never
  # in a bundle. It runs last because it inspects the **built** output.
  #
  # The scan runs on a **pattern list**, not on a live secret value, so a fork
  # PR never receives the key. A finding prints the file and the pattern —
  # never the matched value.
  # ---------------------------------------------------------------------------

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rls-integration]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The admin bundle. The scan over `apps/admin` covers the Next.js build
      # output when it is present.
      - name: build the admin console
        run: pnpm --filter @nagar-shield/admin build || echo "the admin build is optional in this job"

      # The scan itself: the service-role key name, the service-role JWT
      # marker, the secret-key prefix, the banned analytics / ad SDKs, and the
      # SMS OTP feature flag.
      - name: scan the client sources and bundles
        run: pnpm secret:scan

      # The EAS profiles carry the per-profile env vars. The scan checks that
      # the SMS OTP flag is off in every profile and that no profile leaks a
      # server credential.
      - name: scan the EAS profiles
        run: pnpm secret:scan eas.json apps/mobile/app.config.ts apps/mobile/app.json

      # The final gate: the service-role key must not be in the built output.
      # The scan reports a file and a pattern, never the matched value.
      - name: scan the built bundles for the service-role key
        run: |
          pnpm secret:scan apps/admin/.next apps/mobile/dist 2>/dev/null \
            || pnpm secret:scan apps/admin apps/mobile

  # ---------------------------------------------------------------------------
  # The reserved build / release slot.
  #
  # Story 005-admin-skeleton-and-ci asks for "a separate job is reserved for
  # the build/release pipeline that unit 008 will fill in", so the pipeline
  # shape is visible before the pipeline exists. This job is that slot.
  #
  # It is **not** the build. The APK pipeline already exists as its own
  # workflow (`.github/workflows/build.yml` — `preview-apk` + `apk-smoke`),
  # which is unit 008's deliverable and runs on its own schedule and on a
  # manual dispatch. This job is the *PR-facing* slot for it: the place where
  # a build and a release will run once unit 008 wires them together, so the
  # dependency graph shows the release sitting behind every gate rather than
  # floating outside the pipeline.
  #
  # `if: false` keeps it from running today. A reserved job that runs and
  # does nothing is worse than one that is visibly skipped: GitHub marks a
  # skipped job in the run list, so the slot is visible in the UI, and the
  # job's name and needs are the shape unit 008 fills in.
  #
  # When unit 008 wires it, this becomes: checkout → install → build →
  # upload the artifact, with `needs:` naming the gates it must clear.
  # ---------------------------------------------------------------------------

  build:
    name: build (reserved — unit 008)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [secret-scan]
    if: false
    steps:
      - name: reserved for the build and release pipeline
        run: echo "unit 008 fills this job in — see .github/workflows/build.yml"
